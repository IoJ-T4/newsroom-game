<style id="game-mode">/* ===== Game mode (v6): title screen, slots, focus cursor, key hints ===== */
#gm-title{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:auto;padding:24px 16px;background:#11180f;background-image:linear-gradient(#ffffff08 2px,transparent 2px),linear-gradient(90deg,#ffffff08 2px,transparent 2px);background-size:16px 16px;color:#eef0e4}
#gm-title[hidden]{display:none}
#gm-title:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 3px,#0003 3px 4px)}
.gm-title-inner{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;position:relative}
.gm-kicker{display:inline-block;font:10px/1.6 var(--px9);letter-spacing:2px!important;color:#a3b48c;border:2px solid #42503f;padding:3px 10px}
.gm-logo h1{margin:14px 0 6px;font:700 46px/1.15 var(--px11);color:#fffefa;text-shadow:4px 4px 0 #000,0 0 0 #000}
.gm-logo h1 em{font-style:normal;color:var(--px-yellow);text-shadow:4px 4px 0 #8a3b1c}
.gm-logo p{margin:0;font:12px/1.6 var(--px11);color:#cfd3c4}
.gm-press{font:700 14px/1 var(--px11);letter-spacing:4px!important;color:var(--px-yellow);animation:gm-blink 1.1s steps(2,end) infinite}
@keyframes gm-blink{50%{opacity:0}}
.gm-slots{display:grid;gap:8px;width:100%}
.gm-slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;background:#1b241a;border:3px solid #42503f;color:#eef0e4;cursor:pointer;font:12px/1.5 var(--px11)}
.gm-slot b{flex:none;width:34px;height:34px;display:grid;place-items:center;background:#11180f;border:2px solid #42503f;color:#a3b48c;font:700 12px var(--px11)}
.gm-slot span{display:flex;flex-direction:column;min-width:0;flex:1}
.gm-slot strong{font:700 13px/1.4 var(--px11);color:#fffefa}
.gm-slot small{font:10px/1.5 var(--px9);color:#a3b48c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-slot i{font-style:normal;color:var(--px-yellow);animation:gm-blink 1s steps(2,end) infinite}
.gm-slot.on{border-color:var(--px-yellow);background:#262f1f}
.gm-slot.on b{background:var(--px-yellow);border-color:var(--px-yellow);color:#11180f}
.gm-slot.empty strong{color:#cfd3c4}
.gm-slot:hover{border-color:#a3b48c}
.gm-title-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.gm-btn{padding:10px 16px;background:#1b241a;border:3px solid #42503f;color:#eef0e4;font:12px/1.4 var(--px11);cursor:pointer;box-shadow:3px 3px 0 #000}
.gm-btn.primary{background:var(--orange,#e55b32);border-color:#000;color:#fff;font-weight:700}
.gm-btn:hover{filter:brightness(1.1)}
.gm-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.gm-btn kbd{margin-left:6px}
.gm-foot{margin:0;font:10px/1.7 var(--px9);color:#8a8e80;max-width:420px}
#gm-title kbd,.gm-keys kbd,#gm-hint kbd{display:inline-block;min-width:18px;padding:1px 5px;font:10px/1.4 var(--px9);text-align:center;background:#fffefa;color:#11180f;border:2px solid #000;box-shadow:0 2px 0 #000}
#gm-title .gm-btn.primary kbd{background:#fff3;color:#fff;border-color:#0006;box-shadow:none}
.gm-keys{display:grid;gap:8px;margin:14px 0}
.gm-keys div{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font:12px/1.5 var(--px11)}
.gm-keys span{margin-left:auto;color:var(--muted,#5f665f);text-align:right}
.gm-menu{display:grid;gap:8px;margin-top:14px}
/* keyboard / gamepad cursor */
body.gm-kbd :focus-visible,body.gm-kbd :focus{outline:3px solid var(--px-yellow)!important;outline-offset:3px;box-shadow:0 0 0 6px #11180f}
body.gm-kbd .choice-card:focus:before,body.gm-kbd .gm-slot:focus:after{content:'▶';position:absolute;left:-18px;top:50%;margin-top:-8px;font:12px/16px var(--px11);color:var(--orange,#e55b32);animation:gm-blink 1s steps(2,end) infinite}
body.gm-kbd .choice-card{position:relative}
.gm-slot{position:relative}
body.gm-kbd .gm-slot:focus:after{left:-20px;color:var(--px-yellow)}
#gm-hint{position:fixed;right:12px;bottom:12px;z-index:60;display:none;gap:10px;padding:6px 10px;background:#11180fe6;border:2px solid #000;color:#eef0e4;font:10px/1.5 var(--px9);pointer-events:none}
body.gm-kbd #gm-hint,body.gm-pad #gm-hint{display:flex}
body.gm-on-title #gm-hint,body.modal-open #gm-hint{display:none}
@media(pointer:coarse){body:not(.gm-pad) #gm-hint{display:none!important}}
@media(max-width:720px){.gm-logo h1{font-size:34px}.gm-title-inner{gap:16px}#gm-hint{display:none!important}}
@media (prefers-reduced-motion:reduce){.gm-press,.gm-slot i,body.gm-kbd .choice-card:focus:before{animation:none}}
@media(pointer:coarse){#gm-title [data-gm="play-window"],#gm-title [data-gm="controls"]{display:none}.gm-title-actions .gm-btn.primary{padding:14px 40px;font-size:15px}.gm-slot{min-height:56px}}

body{-webkit-font-smoothing:none;-moz-osx-font-smoothing:unset;font-smooth:never;background-color:var(--paper);background-image:linear-gradient(#25302510 1px,transparent 1px),linear-gradient(90deg,#25302510 1px,transparent 1px);background-size:8px 8px}
*,*:before,*:after{border-radius:0!important}
body *{letter-spacing:0!important;transition-timing-function:steps(4,end)!important}
img{image-rendering:pixelated}
.icon{stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;shape-rendering:crispEdges}
.eyebrow,.tiny-label,.nav-label,.side-caption,.edition,.small-orange,.card-eyebrow>span:last-child,.newspaper-top,.visual-caption>span:last-child{letter-spacing:1px!important}
::selection{background:var(--orange);color:#fff}

/* Sidebar */
.sidebar{border-right:4px solid var(--px-ink)}
.brand-mark{transform:none;box-shadow:3px 3px 0 #000}
.brand-mark .icon{stroke-width:2}
.nav-item.active{box-shadow:inset 3px 0 0 var(--orange)}
.active-dot,.online-dot,.save-status>span,.live-dot{border-radius:0!important}
.journey-track{height:12px;padding:2px;background:#11180f;border:2px solid #42503f;position:relative}
.journey-track:after{content:'';position:absolute;inset:2px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/6 - 2px),#11180f calc(100%/6 - 2px) calc(100%/6))}
.journey-track span{transition:width .5s steps(6,end)!important}
.desk-note{border:2px solid #44503e;background:#26332a;box-shadow:4px 4px 0 #0005}
.desk-note:after{transform:none}
.avatar,.desk-avatar{font-size:0!important;color:transparent!important;background:var(--sprite-rookie) center/contain no-repeat,#3a4a3c;image-rendering:pixelated;box-shadow:0 0 0 2px #11180f}
.desk-avatar{background:var(--sprite-desk) center/contain no-repeat,#cfdac0;width:48px!important;height:56px!important;box-shadow:var(--px-frame)}
.profile{border-top:2px solid #3b493a}

/* Top bar and headings */
.topbar{border-bottom:2px solid var(--px-ink)}
.edition{border-left:2px solid var(--px-ink)}
.eyebrow>span{width:6px;height:6px}
.home-title h1 em,.page-heading h1 em{font-style:normal}
.issue-stamp{border-color:var(--px-ink)!important;border-width:2px!important}

/* Cards */
.panel,.briefing-card,.condition-card,.glossary-card,.archive-card,.summary-panel,.result-banner,.share-game,.desk-card,.result-code,.empty-state,.newspaper,.episode-board,.visual-card,.notebook-rules,.notebook-intro{border:2px solid var(--px-ink)!important;box-shadow:var(--px-shadow)}
.condition-card:not(:disabled):hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--px-ink)}
.condition-card.selected{border-color:var(--orange)!important;box-shadow:4px 4px 0 var(--orange)}
.condition-symbol{border-width:2px!important}
.radio-dot{border-width:2px!important}
.episode-tile{border-right:2px solid var(--px-ink)!important}
.pill,.category,.delta-chips>span,.condition-tag,.mini-category{border:2px solid currentColor!important}
.category{color:var(--orange)!important;background:var(--orange-light)!important}
.visual-card{background:#efe7d2}
.visual-caption{border-top:2px solid var(--px-ink)!important}
.pixel-scene-home{width:100%;height:100%;flex:1;min-height:0;display:block;aspect-ratio:159/80}

/* Buttons */
.button,.button.primary,.button.secondary{border:0!important;margin:3px;box-shadow:var(--px-frame),inset -3px -3px 0 #00000026!important;transition:none!important}
.button.primary{background:var(--orange)}
.button.primary:hover:not(:disabled){background:#ef6a3f;transform:translateY(-2px)}
.button:active:not(:disabled){transform:translateY(1px)!important;box-shadow:var(--px-frame),inset 3px 3px 0 #00000033!important}
.button.primary:disabled{background:#dadbd0;color:#8c9180;box-shadow:0 -3px 0 #b9bcad,0 3px 0 #b9bcad,-3px 0 0 #b9bcad,3px 0 0 #b9bcad!important}
.button.secondary{background:var(--px-cream);color:var(--px-ink)}
.button.secondary:hover:not(:disabled){background:#efeedf}
.icon-button{border:2px solid transparent}
.icon-button:hover{border-color:var(--px-ink)}
textarea,input[type=text]{border:2px solid var(--px-ink)!important;background:var(--px-cream)}
textarea:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:3px dashed var(--orange)!important;outline-offset:3px}

/* Game: header */
.deadline{background:var(--px-ink);border:0!important;padding:8px 16px!important;box-shadow:4px 4px 0 #0003;align-self:flex-end}
.deadline>strong{color:var(--px-yellow)!important}
.deadline>span,.deadline strong small{color:#cfd3c4!important}
.deadline.late>strong{color:#ff7a5a!important}

/* Game: stage tracker as pixel tabs */
.stage-tracker{border:0!important;gap:8px;margin-bottom:18px}
.stage{border:2px solid var(--px-ink);background:var(--px-cream);padding:8px 10px!important;color:#8a8e80}
.stage>span{border:2px solid currentColor!important;background:transparent!important;width:24px;height:24px}
.stage.current{background:var(--orange);color:#fff!important;box-shadow:3px 3px 0 var(--px-ink)}
.stage.current>span{color:#fff!important}
.stage.current:after{display:none}
.stage.passed{background:#e5ebdb;color:#4c6540}

/* Game: newsroom scene */
.pixel-scene{position:relative;margin:3px 3px 22px;background:#efe7d2;box-shadow:var(--px-frame),var(--px-drop);line-height:0}
.pixel-scene svg{width:100%;height:auto;display:block}
.scene-bubble{position:absolute;right:9%;bottom:32%;max-width:62%;background:var(--px-cream);color:var(--px-ink);padding:4px 10px;font:700 12px/1.6 var(--px11);box-shadow:0 -3px 0 var(--px-ink),0 3px 0 var(--px-ink),-3px 0 0 var(--px-ink),3px 0 0 var(--px-ink);white-space:nowrap}
.scene-bubble:after{content:'';position:absolute;right:22%;bottom:-9px;width:6px;height:6px;background:var(--px-cream);box-shadow:3px 0 0 var(--px-ink),-3px 0 0 var(--px-ink),0 3px 0 var(--px-ink)}

/* Game: briefing as a dialog box */
.situation{background:var(--px-cream)!important;border:0!important;margin:3px;padding:14px 18px!important;box-shadow:var(--px-frame),var(--px-drop)}
.situation .card-eyebrow>span:first-child{background:var(--green);color:#fff;padding:0 10px 0 6px;box-shadow:3px 3px 0 var(--px-ink);display:inline-flex;gap:5px;align-items:center}
.situation>p{color:#3d4a36!important}

/* Game: choices as a menu */
.decision-heading h2{font-weight:700}
.choices{background:var(--px-cream);margin:3px;padding:8px;box-shadow:var(--px-frame),var(--px-drop);display:flex;flex-direction:column;gap:4px}
.choice-card{border:0!important;background:transparent!important;min-height:0!important;padding:12px 14px 12px 34px!important;position:relative}
.choice-card:not(:disabled):hover{background:#f1efe3!important}
.choice-card:before{content:'▶';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:12px;color:transparent}
.choice-card:not(:disabled):hover:before{color:#b9bcad}
.choice-card.selected{background:var(--orange-light)!important;box-shadow:inset 0 0 0 2px var(--orange)}
.choice-card.selected:before{color:var(--orange)!important;animation:px-blink 1.1s infinite}
.choice-card.selected .choice-text{color:var(--orange)}
.choice-letter{border:2px solid var(--px-ink)!important;color:var(--px-ink)!important;background:transparent!important;font-weight:700}
.choice-card.selected .choice-letter{background:var(--orange)!important;border-color:var(--orange)!important;color:#fff!important}
.choice-card .radio-dot{display:none}
@keyframes px-blink{0%,55%{opacity:1}56%,100%{opacity:0}}

/* Game: desk feedback */
.feedback-box{background:var(--px-cream)!important;border:0!important;margin:24px 3px 3px!important;box-shadow:var(--px-frame),var(--px-drop)}
.feedback-label{display:inline-flex!important;background:var(--orange);color:#fff!important;padding:0 10px 0 6px;box-shadow:3px 3px 0 var(--px-ink)}
.feedback-box blockquote{color:var(--px-ink)!important;padding-left:58px;min-height:56px;position:relative;margin-top:14px!important}
.feedback-box blockquote:before{content:'';position:absolute;left:0;top:2px;width:42px;height:49px;background:var(--sprite-desk) center/contain no-repeat;image-rendering:pixelated}
.learning-note{border-top:2px dashed #c9cdbb!important}

/* Game: aside */
.metric-track{height:14px!important;padding:2px;border:2px solid var(--px-ink);background:#e9e6da!important;position:relative}
.metric-track:after{content:'';position:absolute;inset:2px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#e9e6da calc(10% - 2px) 10%)}
.metric-track>span{transition:width .5s steps(10,end)!important}
.desk-card{background:#e5ebdb!important}
.result-metrics{border:2px solid var(--px-ink)!important;box-shadow:var(--px-shadow)}
.result-metrics>div{border-right:2px dashed #c9cdbb!important}
.result-metrics>div:last-child{border-right:0!important}
.survey-question label span{border:2px solid var(--px-ink)!important}
.survey-question label input:checked+span{box-shadow:3px 3px 0 var(--px-ink)}
.panel-footnote{border-top:2px dashed #d5d8c8!important}

/* Modals and toast */
.modal-backdrop{backdrop-filter:none;-webkit-backdrop-filter:none;background-color:#14221980;background-image:linear-gradient(45deg,#0000001a 25%,transparent 25%,transparent 75%,#0000001a 75%),linear-gradient(45deg,#0000001a 25%,transparent 25%,transparent 75%,#0000001a 75%);background-size:4px 4px;background-position:0 0,2px 2px}
.modal{border:0!important;box-shadow:var(--px-frame),10px 10px 0 #0000004d!important}
#toast{border:0!important;box-shadow:0 -3px 0 var(--px-ink),0 3px 0 var(--px-ink),-3px 0 0 var(--px-ink),3px 0 0 var(--px-ink),6px 6px 0 #0003!important;transition:opacity .2s steps(2,end),transform .2s steps(2,end)}

@media(max-width:720px){.scene-bubble{font-size:10px;padding:2px 6px;right:6%}.stage{padding:6px!important}}
@media print{body{background-image:none}.pixel-scene{box-shadow:none;border:2px solid #000}}

/* Scene sprite animation. 1px inside the SVG = one art pixel; every motion is stepped. */
.pxs .bob{animation:px-bob var(--d,1.4s) steps(1,end) var(--dl,0s) infinite}
@keyframes px-bob{0%{transform:translateY(0)}50%{transform:translateY(var(--y,-1px))}}
.pxs .blink{opacity:0;animation:px-blink var(--d,3.9s) steps(1,end) var(--dl,0s) infinite}
@keyframes px-blink{0%,90%{opacity:0}91%,95%{opacity:1}96%,100%{opacity:0}}
.pxs .talk{opacity:0;animation:px-talk 2.6s steps(1,end) infinite}
@keyframes px-talk{0%{opacity:1}8%{opacity:0}16%{opacity:1}24%{opacity:0}34%{opacity:1}42%{opacity:0}50%{opacity:1}58%,100%{opacity:0}}
.pxs .fr2{animation:px-fr2 var(--d,1s) steps(1,end) infinite;animation-delay:calc(var(--d,1s) * (var(--i,0) - 2) / 2)}
.pxs .fr3{animation:px-fr3 var(--d,1s) steps(1,end) infinite;animation-delay:calc(var(--d,1s) * (var(--i,0) - 3) / 3)}
.pxs .fr4{animation:px-fr4 var(--d,1s) steps(1,end) infinite;animation-delay:calc(var(--d,1s) * (var(--i,0) - 4) / 4)}
@keyframes px-fr2{0%{opacity:1}50%,100%{opacity:0}}
@keyframes px-fr3{0%{opacity:1}33.333%,100%{opacity:0}}
@keyframes px-fr4{0%{opacity:1}25%,100%{opacity:0}}
.pxs .flash{opacity:0;animation:px-flash var(--d,2.6s) steps(1,end) var(--dl,0s) infinite}
@keyframes px-flash{0%{opacity:1}6%,100%{opacity:0}}
.pxs .rise{animation:px-rise 1.6s steps(1,end) var(--dl,0s) infinite}
@keyframes px-rise{0%{transform:translateY(0);opacity:1}25%{transform:translateY(-1px)}50%{transform:translateY(-2px);opacity:.6}75%{transform:translateY(-3px);opacity:.3}100%{opacity:0}}
.pxs .drift{animation:px-drift var(--d,40s) steps(60,end) var(--dl,0s) infinite}
@keyframes px-drift{from{transform:translateX(0)}to{transform:translateX(var(--x,40px))}}
.pxs .type{transform-box:fill-box;transform-origin:0 0;animation:px-type 1.8s steps(1,end) var(--dl,0s) infinite}
@keyframes px-type{0%{transform:scaleX(.12)}20%{transform:scaleX(.34)}40%{transform:scaleX(.56)}60%{transform:scaleX(.78)}80%,100%{transform:scaleX(1)}}
.pxs .ring{animation:px-ring 4s steps(1,end) var(--dl,0s) infinite}
@keyframes px-ring{0%{transform:translateX(-1px)}4%{transform:translateX(1px)}8%{transform:translateX(-1px)}12%{transform:translateX(1px)}16%,100%{transform:translateX(0)}}
.pxs .grow{transform-box:fill-box;transform-origin:50% 100%;animation:px-grow 2.4s steps(1,end) infinite}
@keyframes px-grow{0%{transform:scaleY(.1)}15%{transform:scaleY(.3)}30%{transform:scaleY(.5)}45%{transform:scaleY(.7)}60%{transform:scaleY(.9)}75%,100%{transform:scaleY(1)}}
.pxs .fall{animation:px-fall 3s steps(1,end) infinite}
@keyframes px-fall{0%{transform:translate(0,0)}12%{transform:translate(-3px,1px)}25%{transform:translate(-7px,3px)}37%{transform:translate(-10px,2px)}50%{transform:translate(-14px,4px)}62%{transform:translate(-18px,6px)}75%{transform:translate(-22px,5px)}87%{transform:translate(-26px,8px)}100%{transform:translate(-26px,8px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pxs .fi{opacity:0}}
.scene-bubble{animation:px-pop .45s steps(3,end) both}
@keyframes px-pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.desk-avatar,.feedback-box blockquote:before{animation:px-avatar 1.6s steps(1,end) infinite}
@keyframes px-avatar{50%{transform:translateY(-2px)}}
.scene-bubble b{display:inline-block;background:var(--orange);color:#fff;font-size:10px;line-height:1.5;padding:0 5px;margin-right:7px;vertical-align:1px}
.scene-bubble.tail-left:after{right:auto;left:18%}
@media(max-width:720px){.scene-bubble b{font-size:8px;font-family:var(--px7);padding:0 3px;margin-right:4px}}

/* Game layer: desk bubble, typewriter, metric pops, deadline clock, sound toggle, titles, front page, intro. */
.tw-off{color:transparent}
.scene-bubble{display:flex;align-items:center;gap:6px}
.scene-bubble b{margin-right:0}
.scene-bubble .desk-face{width:24px;height:14px;flex-shrink:0}
.scene-bubble.mood-happy{background:#fff6d0}
.scene-bubble.mood-angry,.scene-bubble.mood-late{background:#ffe0d6;color:#a8321c}
.scene-bubble.mood-sigh{background:#e8eef5}
.scene-bubble.mood-angry,.scene-bubble.mood-late{animation:px-pop .45s steps(3,end) both,px-shake .5s steps(1,end) .45s 3}
@keyframes px-shake{0%{translate:-2px 0}50%{translate:2px 0}100%{translate:0 0}}
.feedback-box blockquote:before{content:none!important}
.feedback-box blockquote .desk-face{position:absolute;left:0;top:4px;width:44px;height:26px}
.metric-label{position:relative}
.delta-pop{position:absolute;right:-4px;top:-14px;font:700 12px/1.5 var(--px11);color:#fff;padding:0 5px;box-shadow:2px 2px 0 var(--px-ink);pointer-events:none;animation:px-deltapop 1.8s steps(9,end) forwards}
.delta-pop.up{background:#5b8a4a}.delta-pop.down{background:#c35a35}
@keyframes px-deltapop{0%{transform:translateY(8px);opacity:0}12%{transform:translateY(0);opacity:1}75%{transform:translateY(-8px);opacity:1}100%{transform:translateY(-14px);opacity:0}}
.deadline{position:relative}
.deadline .px-clock{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.deadline.ticking .px-clock{animation:px-tickshake .12s steps(1,end) infinite}
@keyframes px-tickshake{50%{transform:translateY(-1px)}}
.deadline.ticking>strong{color:#fff!important}
.deadline-projection{display:block;font:10px/1.6 var(--px9);color:#9fe0a8;margin-top:2px}
.deadline-projection.over{color:#ff8a6a}
.deadline.urgent{animation:px-urgent 1s steps(1,end) infinite}
.deadline.urgent>strong{color:#ffb35a!important}
.deadline.urgent:before,.deadline.alarm.late:before{content:'마감 임박!';position:absolute;top:-12px;right:-8px;background:var(--orange);color:#fff;font:10px/1.6 var(--px9);padding:0 6px;box-shadow:2px 2px 0 var(--px-ink);animation:px-blinktag .8s steps(1,end) infinite}
.deadline.alarm.late:before{content:'마감 초과!'}
@keyframes px-urgent{50%{box-shadow:0 0 0 3px #e55b32,4px 4px 0 #0003}}
@keyframes px-blinktag{50%{opacity:.25}}
.sound-toggle{margin-right:18px;color:var(--px-ink)}
.sound-toggle .px-speaker{width:20px;height:20px}
.sound-toggle[aria-pressed="false"]{color:#8a8e80}
.title-panel{display:flex;gap:24px;align-items:center;margin:0 0 27px}
.title-portrait{flex-shrink:0;width:144px;box-shadow:var(--px-frame);margin:3px}
.title-portrait svg{display:block;width:144px;height:120px}
.title-copy h3{font:700 26px/1.4 var(--px11);margin:4px 0 2px}
.badge-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.px-badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--bc);color:var(--px-ink);background:var(--px-cream);padding:2px 8px 2px 4px;font:12px/1.6 var(--px11);box-shadow:2px 2px 0 var(--bc)}
.px-medal{width:14px;height:18px}
.frontpage-panel{margin:0 0 27px}
.frontpage-frame{margin:16px auto 0;max-width:672px;background:#e9e2cf;padding:12px;box-shadow:inset 0 0 0 2px var(--px-ink)}
.frontpage-frame canvas{display:block;width:100%;height:auto;image-rendering:pixelated;margin:0 auto;max-width:672px}
.frontpage-actions{display:flex;justify-content:center;margin-top:16px}
.intro-scene{margin:16px 3px 18px}
.intro-scene .walker{animation:px-walk 2.8s steps(28,end) both}
@keyframes px-walk{from{transform:translateX(-118px)}to{transform:translateX(0)}}
.intro-scene .leg-a{animation:px-lega .3s steps(1,end) 9}
.intro-scene .leg-b{opacity:0;animation:px-legb .3s steps(1,end) 9}
@keyframes px-lega{0%{opacity:0}50%{opacity:1}}
@keyframes px-legb{0%{opacity:1}50%{opacity:0}}
.intro-bubble{animation:px-pop .45s steps(3,end) 2.9s both!important}
.intro-dialog{background:var(--px-cream);box-shadow:var(--px-frame);margin:3px 3px 20px;padding:12px 16px;cursor:pointer}
.intro-dialog p{display:flex;gap:10px;line-height:1.8;margin:4px 0}
.intro-dialog b{flex-shrink:0;background:var(--green);color:#fff;font-size:11px;padding:0 6px;height:20px;line-height:20px}
.intro-dialog .intro-note{color:#6f7466;font-size:12px;padding-top:6px;border-top:2px dashed #c9cdbb;margin-top:10px}
@media(max-width:720px){.scene-bubble{white-space:normal;max-width:64%}.scene-bubble .desk-face{width:18px;height:11px}.title-panel{flex-direction:column;align-items:flex-start}.title-copy h3{font-size:22px}.frontpage-frame{padding:6px}.deadline.urgent:before{right:-4px}}
@media(prefers-reduced-motion:reduce){.tw-off{color:inherit}}
.scene-bubble.seen{animation:none!important}
.deadline-projection{font-size:10px!important}
.title-panel{margin-top:20px}
.sound-toggle .px-speaker{width:24px;height:24px}
.deadline-projection{white-space:nowrap}
@media(max-width:720px){.deadline-projection .dp-long{display:none}}
/* Unanswered survey questions after pressing save. */
.form-error{margin:4px 0 12px;padding:8px 12px;background:#faedda;border-left:4px solid var(--orange);color:#9c3d1c;font:12px/1.7 var(--px11)}
.survey-question.missing legend{color:var(--orange)!important}
.survey-question.missing label>span{border:1px dashed var(--orange)}

/* Career mode (years 2-3): locked choices, reader comments, desk inbox, year review, ending. */

/* Choices */
.choice-card.locked{background:repeating-linear-gradient(135deg,#f1f0e6 0 6px,#e9e8dc 6px 12px)!important;opacity:1!important;cursor:not-allowed}
.choice-card.locked .choice-text{color:#8a8e80}
.choice-card.locked .choice-letter{background:#dadbd0;color:#6f7466}
.choice-card.locked .choice-letter .icon{width:12px;height:12px}
.choice-card.unlocked{border-color:#5b8a4a!important}
.choice-card.unlocked:not(.selected){background:#f1f6e8}
.choice-req{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:1px 6px;font:10px/1.6 var(--px9);color:#8a6a2f;background:#fff1c8;border:2px solid #d8b25a;width:max-content;max-width:100%}
.choice-req .icon{width:11px;height:11px;flex-shrink:0}
.choice-req.open{color:#3e6a31;background:#e4f0d8;border-color:#8fb57c}
.choice-text{display:flex;flex-direction:column;align-items:flex-start}
.choice-head{font:700 13px/1.8 var(--px11);color:var(--px-ink)}
.choice-sub{display:block;font:10px/1.7 var(--px9);color:#6f7466;margin-top:3px}
.choice-sub span{color:#b9bcad;margin:0 3px}
.choice-time em{font-style:normal;color:#c35a35;margin-left:2px}

/* Notes inside the situation card */
.career-note{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:9px 11px;font:11px/1.9 var(--px11);border:2px solid var(--px-ink);box-shadow:3px 3px 0 #25302522}
.career-note .icon{width:15px;height:15px;flex-shrink:0;margin-top:3px}
.career-note b{display:inline-block;margin-right:7px;padding:0 5px;font:10px/1.7 var(--px9);color:#fff;background:var(--px-ink)}
.note-tip{background:#fff6d0}.note-tip b{background:#b88a1c}
.note-cold{background:#e8eef5}.note-cold b{background:#5f7d93}
.note-callback{background:#f1e8f3}.note-callback b{background:#7a5a86}
.note-agenda{background:#edf2e4;margin-top:16px}.note-agenda b{background:#5b8a4a}
.note-question{background:var(--orange-light)}.note-question b{background:var(--orange)}
.learning-note .cn{display:block;margin-top:6px;padding-top:6px;border-top:2px dashed #c9d6b8;color:#5e7350}

/* Reader comments */
.reader-comments{margin-top:16px;border:2px solid var(--px-ink);background:var(--px-cream);box-shadow:3px 3px 0 #25302522}
.rc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 11px;font:700 12px/1.6 var(--px11);background:#efe7d2;border-bottom:2px solid var(--px-ink)}
.rc-head .icon{width:14px;height:14px}
.rc-head small{font:400 10px/1.6 var(--px9);color:#6f7466;margin-left:auto}
.rc{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-bottom:2px dashed #deded4}
.rc:last-child{border-bottom:0}
.rc-avatar{width:22px;height:22px;flex-shrink:0;background:var(--c,#8a8e80);box-shadow:inset 0 -6px 0 #0002,inset 6px 0 0 #fff3,0 0 0 2px var(--px-ink);margin-top:2px}
.rc>div{flex:1;min-width:0}
.rc b{font:10px/1.6 var(--px9);color:#6f7466}
.reader-comments .rc p{font:11px/1.8 var(--px11);color:var(--px-ink);margin:1px 0 0;word-break:keep-all}
.reader-comments .rc.tone-p p{color:#3e6a31}
.reader-comments .rc.tone-q p{color:#3f5f78}
.reader-comments .rc.tone-n p{color:#a8321c}
.reader-comments .rc.tone-f p{color:#5f4b8b}
.reader-comments .rc b{font:10px/1.6 var(--px9);color:#6f7466}
.rc-like{display:flex;align-items:center;gap:3px;font:10px/1 var(--px9);color:#8a8e80;white-space:nowrap;margin-top:4px}
.px-heart{width:10px;height:9px}

/* Junior replies after gatekeeping */
.junior-replies{display:grid;gap:8px;margin-top:14px}
.jr{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--px-cream);border:2px solid var(--px-ink)}
.jr b{font:10px/1.6 var(--px9);color:#6f7466}
.jr p{font:11px/1.8 var(--px11);margin:1px 0 0;color:var(--px-ink)}
.jr-stamp{flex-shrink:0;font:700 11px/1.6 var(--px11);padding:1px 6px;color:#fff;background:#5b8a4a;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--px-ink)}
.jr.pick-hold .jr-stamp{background:#b88a1c}
.jr.pick-cut .jr-stamp{background:#c35a35}

/* Desk inbox */
.desk-inbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot-counter{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;font:12px/1.6 var(--px11);background:#2b4431;color:#e7eddb;border:2px solid var(--px-ink);box-shadow:3px 3px 0 var(--px-ink)}
.slot-counter .icon{width:15px;height:15px}
.slot-counter strong{font:700 14px/1.4 var(--px11);color:var(--px-yellow)}
.slot-counter span{font:10px/1.6 var(--px9);color:#a3b48c;margin-left:auto}
.slot-counter.over{background:#7a2c1a;animation:px-shake .5s steps(1,end) 2}
.slot-counter.over strong{color:#fff}.slot-counter.over span{color:#ffd0c0}
.inbox-card{position:relative;padding:12px;background:#fcfcf6;border:2px solid var(--px-ink);box-shadow:3px 3px 0 #25302533;display:flex;flex-direction:column;min-width:0}
.inbox-card.pick-adopt{background:#f1f6e8;box-shadow:3px 3px 0 #5b8a4a}
.inbox-card.pick-hold{background:#fff8e0;box-shadow:3px 3px 0 #b88a1c}
.inbox-card.pick-cut{background:#f3efe8;box-shadow:3px 3px 0 #c35a35}
.inbox-card.pick-cut h3,.inbox-card.pick-cut p{color:#9a9a8c}
.inbox-head{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:7px}
.inbox-head .mini-category{font:10px/1.5 var(--px9);padding:0 4px}
.inbox-by{font:700 10px/1.6 var(--px9);color:#fff;background:#5f7d93;padding:0 6px}
.flag-pill{font:10px/1.5 var(--px9);padding:0 5px;color:#8a6a2f;background:#fff1c8;border:2px solid currentColor}
.flag-pill.warn{color:#a8321c;background:#ffe0d6}
.inbox-card h3{font:700 13px/1.75 var(--px11);margin:0 0 4px;word-break:keep-all;padding-right:40px}
.inbox-card p{font:11px/1.85 var(--px11);color:#5f6458;margin:0 0 10px;word-break:keep-all;flex:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--px-ink)}
.seg-btn{font:12px/1.5 var(--px11);padding:7px 4px;background:var(--px-cream);color:var(--px-ink);border:0;border-right:2px solid var(--px-ink);cursor:pointer}
.seg-btn:last-child{border-right:0}
.seg-btn:not(:disabled):not(.on):hover{background:#efeedf}
.seg-btn.on{color:#fff;box-shadow:inset -2px -2px 0 #0003}
.seg-adopt.on{background:#5b8a4a}.seg-hold.on{background:#b88a1c}.seg-cut.on{background:#c35a35}
.seg-btn:disabled{cursor:default}
.seg-btn:disabled:not(.on){color:#a8ab9c}
.seg-btn:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
.inbox-stamp{position:absolute;top:8px;right:8px;font:700 11px/1.5 var(--px11);color:#5b8a4a;border:2px solid currentColor;padding:0 4px;transform:rotate(8deg);background:#fffefacc;animation:px-pop .3s steps(3,end) both}
.pick-hold .inbox-stamp{color:#b88a1c}.pick-cut .inbox-stamp{color:#c35a35}

/* Abilities */
.ability-card{margin-top:16px}
.ab-list{display:grid;gap:8px;margin-top:8px}

<style id="v9">/* ===== v9: a different way to play at each stage ===== */

<style id="v10">/* ===== v10: readable text, clearer metrics, a deadline you can see while choosing ===== */

.dl-after li{font:13px/1.55 var(--read,inherit);color:#3a4136}
.dl-after li b{display:inline-block;margin-right:6px;padding:0 5px;font:700 10px/1.7 var(--px9);color:#fff;background:#c35a35}
.dl-after li b.pick-hold{background:#b88a1c}
.dl-after li small{font:10px/1.5 var(--px9);color:#6f7466}
.dl-virtual{margin:10px 0 0;font:10px/1.6 var(--px9);color:#8a8e7c}
/* 4. Score range in years 2–3 */
.y11-evrows{display:grid;gap:6px;margin-top:12px}
.y11-evrows>div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(120px,auto);align-items:baseline;gap:4px 12px;padding:6px 0;border-top:1px dashed #c9cdbb}
.y11-evrows span{font:13px/1.5 var(--px11);color:var(--px-ink);word-break:keep-all}
.y11-evrows b{font:700 14px/1.5 var(--px11);color:#c0461f}
.y11-evrows small{font:11px/1.5 var(--px9);color:#56634d;text-align:right}
/* 5. Likes */
.px-heart.px-like{width:12px;height:11px}
@media(max-width:720px){
  .y11-inbox{grid-template-columns:minmax(0,1fr)}
  .y11-chosen{display:none}
  .slot-counter .y11-msg{flex-basis:100%;margin-left:0;text-align:left}
  .dl-tpls{gap:6px}
  .dl-tpl{padding:7px}
  .dl-tpl small{display:none}
  .dl-page{padding:10px}
  .dl-masthead strong{font-size:21px;letter-spacing:1px}
  .dl-stamp{position:static;display:inline-block;margin-top:3px;transform:none}
  .size-xl .dl-head{font-size:20px}
}
@media(max-width:480px){
  .dl-grid.t3-even,.dl-grid.t4-hero{grid-template-columns:minmax(0,1fr)}

  .y11-evrows>div{grid-template-columns:minmax(0,1fr) auto}
  .y11-evrows small{grid-column:1/-1;text-align:left}
}

  openModal(`<span class="small-orange">ABOUT THIS PROJECT</span><h2 id="modal-title">수습에서 1면까지</h2><p class="modal-intro">뉴스의 생산 과정과 효과를 선택으로 경험하는 기자 양성 시뮬레이션입니다.</p><h3>제작시트에 근거한 MVP</h3><p>「[정이준] 수습에서 1면까지 콘텐츠 시트(완성).md」의 6개 사건, 56개 선택지, 4개 지표, A·B 조건과 가중치를 반영했습니다. 선택 문구·시간·변화량·태그·데스크 반응은 완성본을 따릅니다.</p><p>E2–E6는 완성본에서 새로 설계된 콘텐츠입니다. 모든 지표 변화와 데스크 반응은 설계 가정이며, 학습용 모형입니다. 기사 제목·결과 유형·선택형 설문은 화면 구성을 위해 보완했습니다. 추가 규칙으로 1차 MVP의 마감 초과 불이익(A: 조회수 −10, B: −5)과 사건별 공중 의제를 유지했습니다.</p><h3>학습을 위한 가상 환경</h3><p>사건·매체·인물은 가상입니다. 점수와 지표는 이론의 실제 효과를 측정한 예측값이 아닙니다. 능력치와 장기 인식(배양효과)은 1년차에는 없고, 선택해서 이어 하는 경력 모드(2·3년차)에만 설계 가정으로 넣었습니다. 가상 지지율은 포함하지 않았습니다. 1년차 앞의 프롤로그(건너뛸 수 있음)와 배경음은 두 조건에 똑같이 나옵니다. 원본과 같은 조건으로 실험하려면 링크 끝에 ?prologue=off&bgm=off 를 붙이세요. 타이틀 화면·플레이어 슬롯·키보드와 게임패드 조작 같은 게임 모드도 두 조건에 똑같고, ?game=off 를 더하면 빠집니다. 홈의 도전 모드(빡빡한 마감)는 직접 켤 때만 적용되고, 결과 코드가 FP2T로 시작해 기본판과 구분됩니다. ?v10=off 를 붙이면 v10의 화면 보완(읽기 글꼴, 지표 설명, 사내 평판, 바뀐 데스크 대사 등)이 빠지고, ?v11=off 를 붙이면 v11의 데스크 개편(6중 3택·7중 4택, 지면 배치)과 좋아요 아이콘이 빠집니다. 프롤로그를 봤는지는 내려받기 기록에 남고, 필명은 남지 않습니다.</p><h3>기록과 익명성</h3><p>계정이나 실명 없이 사용합니다. 진행 기록과 선택형 설문은 이 브라우저에만 저장되고 외부 서버로 전송되지 않습니다. 언제든 중단하거나 기록을 초기화할 수 있습니다. 연구를 위한 중앙 수집 기능은 제공하지 않습니다.</p><button class="button primary full" data-action="close-modal">확인했습니다</button>`);

document.addEventListener('click', async event => {
  const button=event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  const action=button.dataset.action;
  if(action==='nav') { event.preventDefault();const target=button.dataset.page;navigate(target); }
  if(action==='menu') $('#sidebar').classList.toggle('mobile-open');
  if(action==='help') helpModal();
  if(action==='about') aboutModal();
  if(action==='rules') rulesModal();
  if(action==='close-modal') closeModal();
  if(action==='condition' && !state.started && !forcedCondition) {
    condition=button.dataset.condition;state=load(condition);selected=null;save();render();
  }
  if(action==='start') {
    if(state.completed) navigate('results');
    else if(state.started) navigate(state.showSummary?'summary':'game');
    else surveyModal('pre');
  }
  if(action==='skip-pre') begin();
  if(action==='select'&&!state.feedback) { selected=button.dataset.id; const scroll=window.scrollY;render();window.scrollTo(0,scroll);$(`[data-id="${selected}"]`)?.focus({preventScroll:true}); }
  if(action==='confirm' && selected && !state.feedback) {
    const valid=events[state.episode].choices[state.stage].some(c=>c.id===selected);
    if(!valid || eventRecords(state.episode).some(r=>r.stage===state.stage)) return;
    const record={event:state.episode,stage:state.stage,id:selected,at:new Date().toISOString()};
    state.history.push(record);state.feedback=record;selected=null;save();render();$('.feedback-box')?.scrollIntoView({behavior:'smooth',block:'nearest'});$('[data-action="advance"]')?.focus({preventScroll:true});
  }
  if(action==='advance'&&state.feedback) {
    state.feedback=null;
    if(state.stage===2) {state.showSummary=true;save();navigate('summary');}
    else {state.stage++;save();navigate('game');}
  }
  if(action==='next-event'&&state.showSummary) {
    state.showSummary=false;
    if(state.episode===5) {state.completed=true;save();navigate('results');}
    else {state.episode++;state.stage=0;save();navigate('game');}
  }
  if(action==='export') exportRecords();
  if(action==='download-game') downloadGame();
  if(action==='copy-code') {
    try { await navigator.clipboard.writeText(resultCode());toast('결과 코드를 복사했습니다.'); }

  }
  if(action==='survey-post') surveyModal('post');
  if(action==='reset') resetModal();
  if(action==='confirm-reset') { state=blankState(state.condition);save();closeModal();navigate('home');toast('첫 화면으로 돌아왔습니다. 출근하기를 누르면 처음부터 시작합니다.'); }
  if(action==='other-condition') { forcedCondition=null;condition=state.condition==='A'?'B':'A';state=load(condition);selected=null;save();navigate(state.completed?'results':'home'); }
});

document.addEventListener('keydown',event=>{
  const radio = event.target.closest('[role="radio"]');
  if(radio && ['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(event.key)) {
    const options=[...radio.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]:not(:disabled)')];
    if(options.length) {
      event.preventDefault();
      const offset=['ArrowDown','ArrowRight'].includes(event.key)?1:-1;
      const index=event.key==='Home'?0:event.key==='End'?options.length-1:(options.indexOf(radio)+offset+options.length)%options.length;
      const target=options[index], id=target.dataset.id, cond=target.dataset.condition;
      target.click();
      document.querySelector(id?`[data-id="${id}"]`:`[data-condition="${cond}"]`)?.focus({preventScroll:true});
    }
  }
  if(!$('.modal')) return;
  if(event.key==='Escape') {closeModal();return;}
  if(event.key==='Tab') {
    const focusable=[...$('.modal').querySelectorAll('button:not(:disabled),input,textarea,a[href]')],first=focusable[0],last=focusable[focusable.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});

    alarm: () => [0, .16, .32].forEach(a => tone(880, .1, {at:a, vol:.04})),

function drawSceneOnCanvas(ctx, svg, ox, oy, scale) {
  const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${svg}</svg>`, 'image/svg+xml');
  const walk = node => {
    for (const el of node.children) {
      const tag = el.tagName.toLowerCase();
      if (tag === 'g') { if (!/\b(fi|blink|talk|flash)\b/.test(el.getAttribute('class') || '')) walk(el); continue; }
      if (tag === 'rect') {
        ctx.fillStyle = el.getAttribute('fill');
        ctx.fillRect(ox + Number(el.getAttribute('x')) * scale, oy + Number(el.getAttribute('y')) * scale, Number(el.getAttribute('width')) * scale, Number(el.getAttribute('height')) * scale);
      } else if (tag === 'text') {
        const size = Number(el.getAttribute('font-size')) * scale;
        ctx.font = `${el.getAttribute('font-weight') === '700' ? '700 ' : ''}${size}px ${el.getAttribute('font-family')}`;
        ctx.fillStyle = el.getAttribute('fill'); ctx.textAlign = el.getAttribute('text-anchor') === 'middle' ? 'center' : el.getAttribute('text-anchor') === 'end' ? 'right' : 'left';
        ctx.fillText(el.textContent, ox + Number(el.getAttribute('x')) * scale, oy + Number(el.getAttribute('y')) * scale);
      }
    }
  };
  walk(doc.documentElement);
  ctx.textAlign = 'left';
}
function wrapText(ctx, text, width) {
  const lines = []; let line = '';
  for (const word of String(text).split(' ')) {
    const test = line ? `${line} ${word}` : word;
    if (ctx.measureText(test).width > width && line) { lines.push(line); line = word; }
    else line = test;
    while (ctx.measureText(line).width > width) {
      let cut = line.length - 1;
      while (cut > 1 && ctx.measureText(line.slice(0, cut)).width > width) cut--;
      lines.push(line.slice(0, cut)); line = line.slice(cut);
    }
  }
  if (line) lines.push(line);
  return lines;
}
function clampLines(ctx, lines, max, width) {
  if (lines.length <= max) return lines;
  const out = lines.slice(0, max); let last = out[max - 1];
  while (last.length > 1 && ctx.measureText(`${last}…`).width > width) last = last.slice(0, -1);
  out[max - 1] = `${last}…`;
  return out;
}

/* Forms are saved from the submit button's click, not the browser's form submission. A preview that sandboxes the page blocks form
   submission outright, and the browser's own "required" bubble points at radio inputs hidden under the pixel boxes, so in both cases
   the button looked dead. Answers are still required and stored exactly as before. */
const PX_FORMS = ['survey-form', 'career-survey-form', 'story-byline'];
document.addEventListener('click', event => {
  const form = event.target.closest('button[type="submit"]')?.form;
  if (!form || !PX_FORMS.includes(form.id)) return;
  event.preventDefault();
  const sets = [...form.querySelectorAll('fieldset')];
  const missing = sets.filter(fs => fs.querySelector('input[required]') && !fs.querySelector('input:checked'));
  sets.forEach(fs => fs.classList.toggle('missing', missing.includes(fs)));
  form.querySelector('.form-error')?.remove();
  if (missing.length) {
    const nums = missing.map(fs => (fs.querySelector('legend')?.textContent.match(/^\d+/) || [])[0]).filter(Boolean);
    (form.querySelector('.survey-buttons') || event.target.closest('button')).insertAdjacentHTML('beforebegin', `<p class="form-error" role="alert">${nums.map(n => `${n}번`).join(', ')} 문항에 아직 답하지 않았어요.</p>`);
    missing[0].scrollIntoView({block:'center', behavior:pxReduce.matches ? 'auto' : 'smooth'});
    missing[0].querySelector('input').focus({preventScroll:true});
    sfx.play('meh');
    return;
  }
  form.dispatchEvent(new Event('submit', {bubbles:true, cancelable:true}));
}, true);
document.addEventListener('change', event => {
  const fs = event.target.closest('fieldset.missing');
  if (!fs) return;
  fs.classList.remove('missing');
  const form = fs.form || fs.closest('form');
  if (!form.querySelector('fieldset.missing')) form.querySelector('.form-error')?.remove();
});

}
function openStory(replay) {

function storyDots() { return STORY.map((_, i) => `<i class="${i <= story.i ? 'on' : ''}"></i>`).join(''); }

function drawStory(enter) {
  const sc = STORY[story.i], scene = PIXEL_SCENES.story[sc.scene], root = $('#story-root');
  const shown = sc.lines.slice(0, story.line + 1);
  let tail = '';
  if (story.step === 'byline') tail = `<form class="story-form" id="story-byline"><label for="story-name">내 바이라인 <small>실명 말고 필명을 적어 주세요. 이 기기의 화면에만 쓰이고, 내려받는 기록에는 들어가지 않습니다.</small></label><div><input id="story-name" maxlength="8" autocomplete="off" placeholder="예: 한결" value="${esc(bylineName())}"><button class="button primary" type="submit">이 이름으로 출근 ${icon('arrow')}</button></div><button type="button" class="text-button" data-story="noname">이름 없이 ‘수습 기자’로 출근</button></form>`;
  if (story.step === 'letter') tail = `<div class="story-letter" role="note" aria-label="앞사람이 남긴 수첩의 첫 장">${STORY_LETTER.map(l => `<p>${esc(l)}</p>`).join('')}<p class="sign">― 먼저 앉았던 사람</p></div><button class="button primary full story-go" data-story="end">${story.replay ? '프롤로그 닫기' : '오전 9시, 첫 출근하기'} ${icon('arrow')}</button>`;
  const text = `<div class="story-box" data-story="next" tabindex="0" role="button" aria-label="다음 문장 보기">${shown.map((l, i) => storyLine(l, i < shown.length - 1 || story.step !== 'lines')).join('')}${story.step === 'lines' ? '<span class="story-more" aria-hidden="true">▼</span>' : ''}</div>${tail}`;

    <div class="story-top"><span id="story-title">PROLOGUE · 수습 전날</span><span class="story-dots" aria-label="${STORY.length}장 중 ${story.i + 1}장">${storyDots()}</span><button class="story-skip" data-story="skip">${story.replay ? '닫기' : '건너뛰기'} ▶▶</button></div>
    <figure class="story-scene pxs ${pxReduce.matches ? '' : 'story-enter'}" ${scene.cam ? `data-cam="${scene.cam}"` : ''}>${sceneSvg(scene, state.condition, 'happy', `${sc.when} 장면`, '', scene.walker ? rookieWalker(scene.walker[0], scene.walker[1]) : '')}<figcaption class="story-when">${sc.when}</figcaption></figure>
    <div class="story-text">${text}</div>

function storyType() {
  clearInterval(storyTimer);
  const el = $('#story-root .story-box').lastElementChild?.previousElementSibling || null;
  const target = el?.matches('.story-phone') ? el.querySelector('span') : el;
  if (!target || pxReduce.matches) { story.typing = null; return; }
  const full = target.textContent; let i = 0;
  target.textContent = ''; story.typing = {target, full};
  storyTimer = setInterval(() => {
    i++; target.textContent = full.slice(0, i);
    if (i % 2 === 0 && full[i - 1]?.trim()) sfx.play('blip');
    if (i >= full.length) { clearInterval(storyTimer); story.typing = null; }
  }, 32);
}
function storyNext() {
  if (story.typing) { clearInterval(storyTimer); story.typing.target.textContent = story.typing.full; story.typing = null; return; }
  const sc = STORY[story.i];
  if (story.step !== 'lines') return;
  if (story.line < sc.lines.length - 1) { story.line++; drawStory(false); return; }
  if (sc.byline) { story.step = 'byline'; drawStory(false); return; }
  if (sc.letter) { story.step = 'letter'; sfx.play('page'); drawStory(false); return; }
  story.i++; story.line = 0; story.step = 'lines'; sfx.play('page'); drawStory(true);
}
function storyAfterByline() { story.i++; story.line = 0; story.step = 'lines'; sfx.play('page'); drawStory(true); render(); }
function closeStory(status) {
  clearInterval(storyTimer);
  const replay = story?.replay;
  if (!replay) storyMark(status);
  story = null; $('#story-root')?.remove();
  app.inert = false; document.body.classList.remove('modal-open');
  render();
  if (!replay) playIntro();
}

document.addEventListener('click', event => {
  if (event.target.closest('[data-action="story-replay"]')) { closeModal(); openStory(true); return; }
  if (!story) return;
  const b = event.target.closest('[data-story]');
  if (!b) return;
  const a = b.dataset.story;
  if (a === 'next') storyNext();

document.addEventListener('submit', event => {
  if (event.target.id !== 'story-byline' || !story) return;
  event.preventDefault();

document.addEventListener('keydown', event => {
  if (!story) return;
  if (event.key === 'Escape') { event.preventDefault(); closeStory(story.replay ? 'watched' : 'skipped'); return; }
  if (story.step === 'lines' && [' ', 'Enter', 'ArrowRight'].includes(event.key) && !event.target.closest('button, input')) { event.preventDefault(); storyNext(); }
  if (event.key === 'Tab') {

/* ===== Background music: three short 8-bit loops written for this game, scheduled on the sound-effect audio context. The same music plays in both conditions; ?bgm=off turns it off. ===== */
const bgm = (() => {
  const OFF_PARAM = params.get('bgm') === 'off';
  const SEMI = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
  const hz = n => { const m = /^([A-G])(#|b)?(\d)$/.exec(n); return 440 * 2 ** ((SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12 - 69) / 12); };
  const CHORD = {F:['F', 'A', 'C'], Am:['A', 'C', 'E'], Bb:['Bb', 'D', 'F'], C:['C', 'E', 'G'], Dm:['D', 'F', 'A'], G:['G', 'B', 'D']};
  // Each bar has 16 steps; "A4@0:6" is A4 at step 0 for 6 steps.
  const parse = s => s.trim().split('|').map(bar => bar.trim().split(/\s+/).map(t => { const [n, at] = t.split('@'), [st, len] = at.split(':').map(Number); return [n, st, len]; }));
  const TRACKS = {
    story:{bpm:76, chords:'F Am Bb C F Dm Bb C', lead:{type:'triangle', vol:.07}, arp:{type:'square', vol:.011, oct:4}, bass:{type:'triangle', vol:.06, pattern:[[0, 0, 8], [8, 7, 8]]},
      notes:'A4@0:6 C5@6:2 F5@8:6 E5@14:2 | E5@0:4 C5@4:4 A4@8:8 | D5@0:6 C5@6:2 Bb4@8:4 D5@12:4 | C5@0:10 G4@12:4 | A4@0:4 C5@4:4 F5@8:4 A5@12:4 | G5@0:6 F5@6:2 D5@8:8 | F5@0:4 D5@4:4 C5@8:4 Bb4@12:4 | A4@0:4 G4@4:4 F4@8:8'},
    newsroom:{bpm:100, chords:'C G Am F C G F G', lead:{type:'square', vol:.018}, bass:{type:'triangle', vol:.06, pattern:[[0, 0, 3], [4, 12, 3], [8, 0, 3], [12, 12, 3]]}, hat:[2, 6, 10, 14],
      notes:'E5@0:2 G5@2:2 C6@4:4 G5@8:2 E5@10:2 G5@12:4 | D5@0:2 G5@2:2 B5@4:4 A5@8:4 G5@12:4 | C5@0:2 E5@2:2 A5@4:4 G5@8:2 E5@10:2 C5@12:4 | F5@0:4 E5@4:4 D5@8:4 C5@12:4 | E5@0:2 G5@2:2 C6@4:4 D6@8:2 C6@10:2 G5@12:4 | B5@0:4 A5@4:2 G5@6:2 D5@8:8 | A5@0:4 G5@4:4 F5@8:2 E5@10:2 D5@12:4 | D5@0:4 E5@4:2 F5@6:2 G5@8:8'},
    field:{bpm:116, chords:'Am F C G Am F C G', lead:{type:'square', vol:.016}, bass:{type:'triangle', vol:.065, pattern:[0, 2, 4, 6, 8, 10, 12, 14].map((s, i) => [s, i % 2 ? 12 : 0, 2])}, hat:[2, 6, 10, 14], kick:[0, 8],
      notes:'A4@0:3 C5@3:3 E5@6:2 A5@8:4 G5@12:2 E5@14:2 | F5@0:4 E5@4:2 C5@6:2 A4@8:8 | G4@0:3 C5@3:3 E5@6:2 G5@8:4 E5@12:4 | D5@0:4 B4@4:4 G4@8:4 B4@12:4 | A5@0:2 G5@2:2 E5@4:2 C5@6:2 E5@8:4 A5@12:4 | C6@0:4 A5@4:4 F5@8:4 A5@12:4 | G5@0:4 E5@4:2 G5@6:2 C6@8:4 B5@12:4 | B5@0:4 G5@4:4 D5@8:4 E5@12:4'}
  };
  // Precompute every step's events: [voice, frequency, steps].
  for (const T of Object.values(TRACKS)) {
    const chords = T.chords.split(' '), lead = parse(T.notes), len = chords.length * 16;
    T.len = len; T.ev = Array.from({length:len}, () => []);
    lead.forEach((bar, b) => bar.forEach(([n, st, l]) => T.ev[b * 16 + st].push(['lead', hz(n), l])));
    chords.forEach((c, b) => {
      const root = hz(`${CHORD[c][0]}2`);
      T.bass.pattern.forEach(([st, semi, l]) => T.ev[b * 16 + st].push(['bass', root * 2 ** (semi / 12), l]));
      if (T.arp) for (let k = 0; k < 8; k++) T.ev[b * 16 + k * 2].push(['arp', hz(`${CHORD[c][[0, 1, 2, 1][k % 4]]}${T.arp.oct}`), 2]);

  let ctx = null, master = null, out = null, noise = null, cur = null, timer = null, step = 0, nextT = 0, gestured = false;
  let on = storage.get('frontpage:bgm') !== 'off' && !OFF_PARAM;
  const voice = (freq, t, dur, type, vol) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.setValueAtTime(vol, t + dur * .6); g.gain.exponentialRampToValueAtTime(.0001, t + dur * .97);

  };
  const hat = t => {
    if (!noise) { noise = ctx.createBuffer(1, ctx.sampleRate * .05, ctx.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(.014, t); g.gain.exponentialRampToValueAtTime(.0001, t + .04);

  };

    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + .09); g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.0001, t + .13);

  };
  const tick = () => {
    if (!cur || !ctx || ctx.state !== 'running') return;
    const T = TRACKS[cur], dur = 60 / T.bpm / 4;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + .05;
    while (nextT < ctx.currentTime + .3) {
      for (const [v, f, l] of T.ev[step]) voice(f, nextT, l * dur, T[v].type, T[v].vol);
      if (T.hat?.includes(step % 16)) hat(nextT);
      if (T.kick?.includes(step % 16)) kick(nextT);

    }
  };
  const fadeOut = () => { if (!out) return; const g = out; g.gain.setTargetAtTime(0, ctx.currentTime, .2); setTimeout(() => g.disconnect(), 1200); out = null; };
  const play = name => {
    if (!master) { master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination); }
    fadeOut();
    out = ctx.createGain(); out.gain.setValueAtTime(0, ctx.currentTime); out.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.2); out.connect(master);
    cur = name; step = 0; nextT = ctx.currentTime + .08;

    if (story) return 'story';
    if (page === 'ending') return 'story';
    if (page === 'game' || (page === 'career' && careerState()?.phase === 'play')) return 'field';
    return 'newsroom';
  };
  return {
    get on() { return on; },
    gesture() { gestured = true; },
    sync() {
      if (!on || !gestured || document.hidden) { stop(); return; }
      ctx = ctx || sfx.audio(); if (!ctx) return;
      const w = wanted();
      if (w !== cur) play(w);
    },
    toggle() { on = !on; storage.set('frontpage:bgm', on ? 'on' : 'off'); gestured = true; this.sync(); return on; }
  };
})();
function pixelNote(on) {
  const rows = '..KKKKKK|..KKKKKK|..K....K|..K....K|.KK...KK|KKK..KKK|KKK..KKK|.K....K.'.split('|');
  const slash = on ? '' : [0, 1, 2, 3, 4, 5, 6, 7].map(i => pxRect(i, 7 - i, 1, 1, '#e55b32')).join('');
  return `<svg class="px-note" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${pxRows(rows, {K:'currentColor'}, 0, 0)}${slash}</svg>`;
}
function musicButton() {
  return `<button class="icon-button music-toggle" data-action="music" aria-pressed="${bgm.on}" aria-label="배경음 ${bgm.on ? '끄기' : '켜기'}" title="배경음 ${bgm.on ? '끄기' : '켜기'}">${pixelNote(bgm.on)}</button>`;
}
for (const type of ['pointerdown', 'keydown']) document.addEventListener(type, () => bgm.gesture(), {capture:true, passive:true});
document.addEventListener('click', event => {
  const b = event.target.closest('[data-action="music"]');
  if (b) {
    const now = bgm.toggle();
    b.setAttribute('aria-pressed', now); b.setAttribute('aria-label', `배경음 ${now ? '끄기' : '켜기'}`); b.title = `배경음 ${now ? '끄기' : '켜기'}`; b.innerHTML = pixelNote(now);
    return;
  }
  bgm.sync();

document.addEventListener('visibilitychange', () => bgm.sync());

/* ===== Game mode (v6): title screen, player slots, keyboard/gamepad control, fullscreen, pause menu.
   It only wraps the existing screens. It does not touch conditions, choices, scores, result codes or exports,
   and it is the same in conditions A and B. ?game=off removes the whole layer. ===== */
const GM_PARAMS = new URLSearchParams(location.search);
const GM_ON = GM_PARAMS.get('game') !== 'off';
const GM_SLOTS = 3;
const GM_TOUCH = matchMedia('(pointer: coarse)').matches;
const GM_EMBED = (() => { try { return window.top !== window; } catch { return true; } })();
const GM_KEEP = ['frontpage:bgm', 'frontpage:sound']; // device settings, shared by every slot
const gmLS = {
  keys() { try { return Object.keys(localStorage); } catch { return []; } },
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const gmSS = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
  del(k) { try { sessionStorage.removeItem(k); } catch {} }
};
function gmActive() { const n = Number(gmLS.get('frontpage-gm:active')); return n >= 1 && n <= GM_SLOTS ? n : 1; }
function gmPlayerKeys() { return gmLS.keys().filter(k => k.startsWith('frontpage:') && !GM_KEEP.includes(k)); }
function gmLiveSnapshot() { const o = {}; for (const k of gmPlayerKeys()) o[k] = gmLS.get(k); return o; }
function gmSlotData(n) {
  if (n === gmActive()) return gmLiveSnapshot();
  try { return JSON.parse(gmLS.get(`frontpage-gm:slot:${n}`)) || {}; } catch { return {}; }
}
function gmSlotInfo(n) {
  const d = gmSlotData(n), cond = d['frontpage:content2:last'] || 'A';
  let st = null, ca = null;
  try { st = JSON.parse(d[`frontpage:content2:${cond}`]); } catch {}
  try { ca = JSON.parse(d[`frontpage:career3:${cond}`]); } catch {}
  const name = d['frontpage:byline'] || '';
  if (!st || !st.started) return {empty: !Object.keys(d).length || !st, name, line: name ? '출근 전' : '빈 슬롯'};
  let line;
  if (ca && (ca.ended || ca.phase === 'done')) line = '경력 엔딩까지 완료';
  else if (ca && ca.year) line = `경력 모드 ${Math.min(3, ca.phase === 'review' ? ca.year + 1 : ca.year)}년차 진행 중`;
  else if (st.completed) line = '1년차 완료 · 1면 확인 가능';
  else line = `1년차 사건 ${st.episode + 1} / 6`;
  return {empty: false, name, line: `${conditions[cond]?.name || ''} · ${line}`};
}
function gmSwitch(n) {
  const cur = gmActive();
  if (n === cur) return false;
  gmLS.set(`frontpage-gm:slot:${cur}`, JSON.stringify(gmLiveSnapshot()));
  for (const k of gmPlayerKeys()) gmLS.del(k);
  const next = gmSlotData(n);
  for (const [k, v] of Object.entries(next)) if (k.startsWith('frontpage:') && !GM_KEEP.includes(k)) gmLS.set(k, v);
  gmLS.del(`frontpage-gm:slot:${n}`);
  gmLS.set('frontpage-gm:active', String(n));
  gmSS.set('frontpage-gm:skip-title', '1');
  location.reload();
  return true;
}
function gmClearSlot(n) { if (n !== gmActive()) gmLS.del(`frontpage-gm:slot:${n}`); }

/* ----- fullscreen ----- */
function gmIsFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function gmFullscreen(on = !gmIsFull()) {

/* ----- title screen ----- */

    <div class="gm-press" aria-hidden="true">PRESS START</div>

/* ----- input: keyboard ----- */
function gmLayer() {
  if (gmTitleOpen()) return gmTitle;
  const sr = document.getElementById('story-root');
  if (typeof story !== 'undefined' && story && sr) return sr;
  return $('.modal') || app;
}
const gmVisible = el => el && !el.disabled && el.offsetParent !== null && !el.closest('[hidden],[inert]');
function gmFocusables(root) { return [...root.querySelectorAll('button, a[href], input, textarea, select, [tabindex="0"]')].filter(gmVisible); }
function gmPrimary(root) {
  for (const a of ['confirm', 'advance', 'career-confirm', 'career-advance', 'next-event', 'career-next']) {
    const b = root.querySelector(`[data-action="${a}"]`);
    if (b && b.offsetParent !== null) return b.disabled ? null : b;
  }
  const list = [...root.querySelectorAll('.button.primary, .gm-btn.primary')].filter(gmVisible);
  return list.find(b => b.closest('.modal')) || list[0] || null;
}
function gmGroup(root) {
  const f = document.activeElement?.closest('[role="radiogroup"]');
  if (f && root.contains(f)) return f;
  return [...root.querySelectorAll('[role="radiogroup"]')].find(g => gmVisible(g) && g.querySelector('[role="radio"]:not(:disabled)')) || null;
}
function gmMove(dir) {
  const root = gmLayer(), f = gmFocusables(root);
  if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  const inMain = f.filter(el => el.closest('#main'));
  const n = i >= 0 ? f[(i + dir + f.length) % f.length] : (inMain.length ? inMain[dir > 0 ? 0 : inMain.length - 1] : f[dir > 0 ? 0 : f.length - 1]);
  n.focus({preventScroll: true}); n.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}
function gmConfirm() {
  const root = gmLayer(), a = document.activeElement;
  if (a && root.contains(a) && a !== root && a.matches('button, a[href], [role="radio"]') && !(a.matches('[role="radio"][aria-checked="true"]'))) { a.click(); return true; }
  const p = gmPrimary(root);
  if (p) { p.click(); return true; }
  return false;
}
function gmBack() {
  if (gmTitleOpen()) return;
  if ($('.modal')) { closeModal(); return; }
  if ($('#sidebar.mobile-open')) { $('#sidebar').classList.remove('mobile-open'); return; }
  gmPause();
}
function gmEat(e) { e.preventDefault(); e.stopPropagation(); }
document.addEventListener('keydown', event => {
  if (!GM_ON || event.ctrlKey || event.metaKey || event.altKey) return;
  document.body.classList.add('gm-kbd');
  const t = event.target, typing = t.closest?.('input, textarea, select, [contenteditable="true"]');
  const k = event.key;
  if (typing) { if (k === 'Escape' && !$('.modal') && !gmTitleOpen()) t.blur(); return; }
  const storyOn = typeof story !== 'undefined' && story;
  if (storyOn) { if (k === 'f' || k === 'F') gmFullscreen(); return; } // the prologue keeps its own keys (Esc skips it)
  if (gmTitleOpen()) {
    if (k === 'Enter' && !t.closest('button')) { gmEat(event); gmTitle.querySelector('[data-gm="play"]').click(); }
    else if (/^[1-3]$/.test(k)) { gmEat(event); gmTitle.querySelector(`[data-n="${k}"]`)?.click(); }
    else if (k === 'ArrowDown' || k === 'ArrowRight') { gmEat(event); gmMove(1); }
    else if (k === 'ArrowUp' || k === 'ArrowLeft') { gmEat(event); gmMove(-1); }
    else if (k === 'f' || k === 'F') gmFullscreen();
    return;
  }
  if (k === 'f' || k === 'F') { gmEat(event); gmFullscreen(); return; }
  if (k === 'p' || k === 'P') { gmEat(event); $('.modal') ? closeModal() : gmPause(); return; }
  if (k === 'h' || k === '?') { gmEat(event); if (!$('.modal')) openModal(gmControlsHTML()); return; }
  if (k === 'Escape' && !$('.modal')) { gmEat(event); gmBack(); return; }
  const root = gmLayer();
  const idx = /^[1-9]$/.test(k) ? Number(k) - 1 : /^[a-dA-D]$/.test(k) ? k.toLowerCase().charCodeAt(0) - 97 : -1;
  if (idx >= 0) {
    const g = gmGroup(root), opts = g ? [...g.querySelectorAll('[role="radio"]')].filter(gmVisible) : [];
    if (opts[idx]) { gmEat(event); const id = opts[idx].dataset.id; opts[idx].click(); const el = root.querySelector(`[data-id="${id}"]`) || opts[idx]; el.focus?.({preventScroll: true}); el.scrollIntoView?.({block: 'center', behavior: 'smooth'}); }
    return;
  }
  if (k === 'Enter') {
    const a = document.activeElement;
    const idle = !a || !root.contains(a) || !a.matches('button, a[href], [role="radio"], summary');
    if (idle || a.matches('[role="radio"][aria-checked="true"]')) { gmEat(event); gmConfirm(); }
    return;
  }
  if ((k === 'ArrowDown' || k === 'ArrowUp') && !document.activeElement?.closest('[role="radiogroup"]')) {
    const a = document.activeElement;
    if (a && root.contains(a) && a.matches('button, a[href], summary')) { gmEat(event); gmMove(k === 'ArrowDown' ? 1 : -1); }
    else { gmEat(event); gmMove(k === 'ArrowDown' ? 1 : -1); }
  }
}, true);
document.addEventListener('pointerdown', () => document.body.classList.remove('gm-kbd'), {passive: true});

/* ----- input: gamepad (standard mapping) ----- */
const gmPad = {held: {}, raf: 0, last: 0};
function gmKey(key) { (document.activeElement || document.body).dispatchEvent(new KeyboardEvent('keydown', {key, bubbles: true, cancelable: true})); }
function gmPadPress(b) {
  document.body.classList.add('gm-kbd');
  const storyOn = typeof story !== 'undefined' && story;
  if (b === 12 || b === 14) { storyOn || gmTitleOpen() || $('.modal') || !document.activeElement?.closest('[role="radiogroup"]') ? gmMove(-1) : gmKey(b === 12 ? 'ArrowUp' : 'ArrowLeft'); }
  else if (b === 13 || b === 15) { if (storyOn && b === 15) { gmKey('ArrowRight'); return; } storyOn || gmTitleOpen() || $('.modal') || !document.activeElement?.closest('[role="radiogroup"]') ? gmMove(1) : gmKey(b === 13 ? 'ArrowDown' : 'ArrowRight'); }
  else if (b === 0) {
    if (storyOn) { const a = document.activeElement; a && a.closest('#story-root button') ? a.click() : gmKey(' '); return; }
    if (gmTitleOpen()) { const a = document.activeElement; (a && gmTitle.contains(a) ? a : gmTitle.querySelector('[data-gm="play"]')).click(); return; }
    gmConfirm();
  }
  else if (b === 1) { if (!storyOn) gmBack(); }
  else if (b === 9) { if (!storyOn && !gmTitleOpen()) ($('.modal') ? closeModal() : gmPause()); }
}
function gmPadLoop(ts) {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  if (!pads.length) { gmPad.raf = 0; return; }
  const p = pads[0], now = {};
  for (const b of [0, 1, 9, 12, 13, 14, 15]) now[b] = !!p.buttons[b]?.pressed;
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  if (ay < -0.6) now[12] = true; if (ay > 0.6) now[13] = true; if (ax < -0.6) now[14] = true; if (ax > 0.6) now[15] = true;
  for (const b in now) {
    if (now[b] && !gmPad.held[b]) { gmPad.held[b] = ts; gmPadPress(Number(b)); }
    else if (now[b] && b >= 12 && ts - gmPad.held[b] > 380) { gmPad.held[b] = ts - 250; gmPadPress(Number(b)); }
    else if (!now[b]) delete gmPad.held[b];
  }
  gmPad.raf = requestAnimationFrame(gmPadLoop);
}
window.addEventListener('gamepadconnected', () => { if (!GM_ON) return; document.body.classList.add('gm-pad'); toast('게임패드가 연결됐습니다. 십자키로 이동하고 A로 결정하세요.'); if (!gmPad.raf) gmPad.raf = requestAnimationFrame(gmPadLoop); });
window.addEventListener('gamepaddisconnected', () => document.body.classList.remove('gm-pad'));

  E3:{def:'경마 저널리즘은 선거를 경주처럼 다뤄 누가 앞서고 뒤지는지(지지율, 판세)에 집중하는 보도입니다. 점화효과는 언론이 자주 다룬 기준을 유권자가 후보를 평가할 때 떠올리게 되는 효과입니다.',

  E5:{def:'경성 뉴스는 정치·경제·정책처럼 삶에 영향이 큰 뉴스, 연성 뉴스는 연예·화제처럼 흥미 위주의 뉴스입니다. 지면과 시간은 한정되어 있어, 하나를 올리면 다른 하나가 빠집니다.',

function y10TrustWhy(c) {
  if (!Y10_ON || !(c.delta && c.delta[1] < 0)) return '';
  const v = c.variantOf && Y1V?.[c.variantOf]?.[c.id];
  const t = (!(v && v.text) && TRUST_WHY[c.id]) || TRUST_WHY_TAG[c.tag];
  return t ? `<p class="why-line trust-why">${icon('shield')}<span><b>신뢰도가 깎인 이유</b>${esc(t)}</span></p>` : '';
}
function y10TagDefs(tags, withName) {
  return tags.filter(t => TAG_DEF[t]).map(t => `<span class="ln-def">${withName ? `<b class="ln-tag">${esc(t)}</b>` : ''}<em class="ln-kind">${esc(TAG_DEF[t][0])}</em>${esc(TAG_DEF[t][1])}</span>`).join('');
}
function y10TagDef(c) { return Y10_ON ? y10TagDefs([c.tag, c.frame].filter(Boolean), false) : ''; }
function y10Learn(c, ev) {
  if (!Y10_ON) return '';
  const e = events[ev], con = EV_CONCEPT[e.id], link = con?.links?.[c.id];
  return `<div class="learning-note y10-learn">${icon('book')}<span>${y10TagDefs([c.tag, c.frame].filter(Boolean), true)}<span class="ln-concept"><b>이 사건의 개념 · ${esc(e.theory)}</b>${esc(con?.def || '')}${link ? `<span class="ln-link"><b>내 선택과의 관계</b>${esc(link)}</span>` : ''}</span>${y1Notes(c)}</span></div>`;
}

/* ---------- 2. Newsroom reputation (사내 평판): how the desk sees you. Display only in year 1; it decides the year-3 path. ---------- */
function y10RepPtsY1(r) { return Y10_REP_PTS[deskMood(r)] || 0; }
function y10RepY1(upto) { let rep = 50; for (const r of state.history.slice(0, upto ?? state.history.length)) rep = clamp(rep + y10RepPtsY1(r)); return rep; }
function y10FcPts(id, k = careerState()) { const got = k?.fc?.[id] || {}; return (FC[id] || []).reduce((s, x, i) => s + (got[i] ? (got[i] === x.a ? 1 : -1) : 0), 0); }
function y10RepPtsC(r, hist) {
  if (r.event === 'X1' && r.stage === 0) return ({comply:4, compromise:0, resist:-8})[recChoice(r, hist).order] ?? 0;
  let p = Y10_REP_PTS[careerMood(r, hist)] || 0;
  if (r.id === 'X1-08') p -= 3;
  if (r.stage === 2 && cKind(r.event) === 'expert') p += y10FcPts(r.event);
  return p;
}
function y10Rep(hist = careerState()?.history || []) { let rep = y10RepY1(); for (const r of hist) rep = clamp(rep + y10RepPtsC(r, hist)); return rep; }
